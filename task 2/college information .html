<!DOCTYPE html>
<html>
<head>
    <title>College Website</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        header {
            background: #123c69;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background: #0b2545;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 12px;
            font-weight: bold;
        }

        .banner {
            background: linear-gradient(120deg, #123c69, #3a86c8);
            color: white;
            text-align: center;
            padding: 80px 20px;
        }

        .banner h2 {
            font-size: 35px;
            margin-bottom: 15px;
        }

        .container {
            padding: 30px;
            text-align: center;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 25px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 10px #ccc;
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-8px);
        }

        .card h3 {
            color: #123c69;
            margin-bottom: 12px;
        }

        footer {
            background: #0b2545;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 30px;
        }

        @media(max-width: 600px) {
            nav a {
                display: inline-block;
                margin: 8px;
            }

            .banner h2 {
                font-size: 25px;
            }
        }
    </style>
</head>
