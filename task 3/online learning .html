<!DOCTYPE html>
<html>
<head>
    <title>E-Learning Website</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6fb;
        }

        header {
            background: #252b5c;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background: #171b40;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
        }

        .banner {
            background: linear-gradient(120deg, #252b5c, #6965c5);
            color: white;
            text-align: center;
            padding: 65px 20px;
        }

        .banner h2 {
            font-size: 35px;
            margin-bottom: 15px;
        }

        .container {
            padding: 30px;
            text-align: center;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 25px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 3px 10px #ccc;
            transition: 0.3s;
            text-align: left;
        }

        .card:hover {
            transform: translateY(-7px);
        }

        .thumbnail {
            background: linear-gradient(120deg, #6965c5, #a5a0ed);
            color: white;
            height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .card h3 {
            color: #252b5c;
            margin-bottom: 10px;
        }

        .card p {
            margin: 8px 0;
            color: #555;
        }

        button {
            background: #514dc0;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 12px;
        }

        button:hover {
            background: #252b5c;
        }

        .progress {
            background: #ddd;
            height: 10px;
            border-radius: 10px;
            margin-top: 10px;
        }

        .progress-bar {
            background: #514dc0;
            height: 10px;
            border-radius: 10px;
        }

        footer {
            background: #171b40;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 30px;
        }

        @media(max-width: 600px) {
            nav a {
                display: inline-block;
                margin: 8px;
            }

            .banner h2 {
                font-size: 25px;
            }
        }
    </style>
</head>
