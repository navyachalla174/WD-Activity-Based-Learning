<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Portfolio</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6ff;
            color: #222;
        }

        header {
            background: #15152e;
            color: white;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h2 {
            color: #00d4ff;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            transition: 0.3s;
        }

        nav a:hover {
            color: #00d4ff;
        }

        section {
            padding: 70px 10%;
            text-align: center;
        }

        .home {
            min-height: 90vh;
            background: linear-gradient(135deg, #15152e, #354b83);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .home h1 {
            font-size: 45px;
            animation: slideDown 1.5s ease;
        }

        .home h2 {
            color: #00d4ff;
            margin: 15px;
        }

        .home p {
            max-width: 600px;
            line-height: 1.8;
        }

        .btn {
            display: inline-block;
            background: #00d4ff;
            color: #15152e;
            padding: 12px 25px;
            margin-top: 25px;
            border-radius: 25px;
            text-decoration: none;
            transition: 0.3s;
        }

        .btn:hover {
            background: white;
            transform: scale(1.1);
        }

        h2.title {
            color: #252552;
            margin-bottom: 30px;
            font-size: 32px;
        }

        .card-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 25px;
        }

        .card {
            background: white;
            padding: 25px;
            width: 280px;
            border-radius: 15px;
            box-shadow: 0 5px 20px #00000015;
            transition: 0.4s;
            animation: fadeIn 1.2s ease;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 10px 25px #00000025;
        }

        .card h3 {
            color: #354b83;
            margin-bottom: 15px;
        }

        .card p {
            line-height: 1.7;
        }

        .skills {
            background: #e8ecff;
        }

        .skill {
            margin: 20px auto;
            max-width: 600px;
            text-align: left;
        }

        .bar {
            background: #ccc;
            height: 12px;
            border-radius: 10px;
            margin-top: 8px;
            overflow: hidden;
        }

        .progress {
            height: 12px;
            background: linear-gradient(90deg, #354b83, #00d4ff);
            border-radius: 10px;
            animation: grow 2s ease;
        }

        .contact {
            background: #15152e;
            color: white;
        }

        .contact h2 {
            color: #00d4ff;
        }

        .contact p {
            margin: 15px;
        }

        footer {
            background: #101020;
            color: white;
            text-align: center;
            padding: 20px;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes grow {
            from {
                width: 0;
            }
        }

        @media(max-width: 768px) {
            header {
                flex-direction: column;
                gap: 15px;
            }

            nav a {
                display: inline-block;
                margin: 5px;
                font-size: 13px;
            }

            .home h1 {
                font-size: 32px;
            }

            section {
                padding: 50px 5%;
            }
        }
    </style>
</head>
